<rect x="485" y="273" width="60" height="22" rx="11" fill="#fff4cc" stroke="#d4a017"/>
<text x="515" y="289" font-size="12.5" fill="#102a32" text-anchor="middle" font-weight="bold">TDS-2</text>
<rect x="485" y="431" width="60" height="22" rx="11" fill="#fff4cc" stroke="#d4a017"/>
<text x="515" y="447" font-size="12.5" fill="#102a32" text-anchor="middle" font-weight="bold">TDS-3</text>
<text x="646" y="230" font-size="12" fill="#d64545" text-anchor="end">ใช้ร่วมกับหัววัดอุณหภูมิ (จุด NTC-1)</text>
<text x="30" y="540" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">TDS-1 = สาย A (เหลือง) + ขาหนึ่งของ 4.7kΩ</text>
<text x="30" y="564" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">TDS-2 = อีกขาของ 4.7kΩ + ขา + (ขายาว) ของ 10µF + ขาหนึ่งของ 104 + สายไป S ของ D34</text>
<text x="30" y="588" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">TDS-3 = ขา − (ฝั่งแถบสี) ของ 10µF + อีกขาของ 104 + สายไป G ของ D34</text>
<text x="30" y="612" font-size="13.5" fill="#587480" text-anchor="start">บัดกรีทุกจุดแล้วหุ้มท่อหด · 4.7kΩ = เหลือง-ม่วง-แดง-ทอง · 104 ไม่มีขั้ว · 100µF ขา + ลงขา + ของบอร์ด TDS</text>
