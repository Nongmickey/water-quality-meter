<text x="30" y="708" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">1) ตัวต้านทาน 4.7kΩ (เหลือง-ม่วง-แดง-ทอง) ต่อระหว่าง S ของ D25 กับจุด X</text>
<text x="30" y="731" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">2) จุด X = ขาตัวต้านทาน + สายไป S ของ D33 + สายไปรู 1 ของหัวต่อหัววัด (บัดกรีหรือมัดรวมให้แน่น แล้วหุ้มเทป)</text>
<text x="30" y="754" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">3) รู 2 ของหัวต่อหัววัด ต่อไป S ของ D26 · สลับรู 1 กับรู 2 ได้ ไม่มีขั้ว</text>
<text x="30" y="777" font-size="13.5" fill="#587480" text-anchor="start">ปุ่มและจอต่อเหมือนเดิม · อัปโหลดโค้ด tds_ac · กดปุ่มสั้น = วัด, กดค้าง 3 วินาที = คาลิเบรต</text>
