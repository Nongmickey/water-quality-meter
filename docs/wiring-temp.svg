<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 840" width="920" height="840" font-family="Tahoma, 'Noto Sans Thai', sans-serif">
<rect width="920" height="840" fill="#ffffff"/>
<text x="30" y="40" font-size="22" fill="#102a32" text-anchor="start" font-weight="bold">การต่อหัววัดอุณหภูมิ NTC กับ ESP32 (โค้ด temp_test)</text>
<text x="30" y="64" font-size="13.5" fill="#587480" text-anchor="start">NTC 10k ต่อกับตัวต้านทาน 4.7k เป็นตัวแบ่งแรงดันจากไฟ 3V3 · น้ำร้อนขึ้น แรงดันที่ D32 ลดลง</text>
<rect x="680" y="92" width="210" height="600" rx="12" fill="#1d2f3a"/>
<text x="785" y="124" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">บอร์ดขยาย ESP32</text>
<text x="785" y="150" font-size="12" fill="#f0b4ac" text-anchor="middle" font-weight="bold">ใช้ช่อง S เท่านั้น ห้ามใช้ช่อง V</text>
<rect x="673" y="193" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="698" y="205" font-size="14" fill="#ffffff" text-anchor="start">3V3</text>
<rect x="673" y="283" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="698" y="295" font-size="14" fill="#ffffff" text-anchor="start">S ของ D32</text>
<rect x="673" y="453" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="698" y="465" font-size="14" fill="#ffffff" text-anchor="start">G</text>
<rect x="673" y="548" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="698" y="560" font-size="14" fill="#ffffff" text-anchor="start">S ของ D21</text>
<rect x="673" y="578" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="698" y="590" font-size="14" fill="#ffffff" text-anchor="start">S ของ D22</text>
<rect x="673" y="608" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="698" y="620" font-size="14" fill="#ffffff" text-anchor="start">VIN (5V)</text>
<rect x="673" y="638" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="698" y="650" font-size="14" fill="#ffffff" text-anchor="start">G</text>
<text x="785" y="360" font-size="12" fill="#9fc3cc" text-anchor="middle">ช่องอื่นที่ต่อไว้แล้ว</text>
<text x="785" y="378" font-size="12" fill="#9fc3cc" text-anchor="middle">TDS (D25 D26 D33) · pH (D35)</text>
<text x="785" y="396" font-size="12" fill="#9fc3cc" text-anchor="middle">ปุ่ม (D15) ต่อค้างไว้ได้</text>
<polyline points="673,200 470,200 470,290" fill="none" stroke="#d64545" stroke-width="3.5" stroke-linejoin="round"/>
