<text x="200" y="372" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold">สาย 2</text>
<rect x="220" y="540" width="250" height="120" rx="8" fill="#eef4f5" stroke="#0b7480" stroke-width="2"/>
<text x="345" y="605" font-size="15" fill="#102a32" text-anchor="middle" font-weight="bold">จอ LCD 20×4 (I2C)</text>
<rect x="463" y="548" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="456" y="560" font-size="13" fill="#102a32" text-anchor="end" font-weight="bold">SDA</text>
<polyline points="477,555 673,555" fill="none" stroke="#2b6fd6" stroke-width="3" stroke-linejoin="round"/>
<rect x="463" y="578" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="456" y="590" font-size="13" fill="#102a32" text-anchor="end" font-weight="bold">SCL</text>
<polyline points="477,585 673,585" fill="none" stroke="#8e44ad" stroke-width="3" stroke-linejoin="round"/>
<rect x="463" y="608" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="456" y="620" font-size="13" fill="#102a32" text-anchor="end" font-weight="bold">VCC</text>
<polyline points="477,615 673,615" fill="none" stroke="#d64545" stroke-width="3" stroke-linejoin="round"/>
<rect x="463" y="638" width="14" height="14" fill="#d9c27a" stroke="#8a7330"/>
<text x="456" y="650" font-size="13" fill="#102a32" text-anchor="end" font-weight="bold">GND</text>
<polyline points="477,645 673,645" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
<text x="30" y="725" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">1) 3V3 → ตัวต้านทาน 4.7kΩ → จุด T · จุด T → สายไป S ของ D32   (ต้องใช้ 3V3 ห้ามใช้ VIN/5V)</text>
<text x="30" y="748" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">2) NTC สาย 1 → จุด T · สาย 2 → G   (สลับสายได้ ไม่มีขั้ว)</text>
<text x="30" y="771" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">3) 10µF: ขายาว (+) ต่อจุด T, ขาข้างแถบขาว (−) ต่อ G · 104: ไม่มีขั้ว ต่อจุด T กับ G</text>
<text x="30" y="794" font-size="13.5" fill="#587480" text-anchor="start">อัปโหลดโค้ด temp_test · ค่าอัปเดตทุก 1 วินาที · กำหัววัดไว้ในมือ ค่าต้องค่อยๆ ขึ้น</text>
<text x="30" y="817" font-size="13.5" fill="#587480" text-anchor="start">โค้ด tds_ac อ่านอุณหภูมิจาก D32 อัตโนมัติ ต่อ NTC แล้วจอ TDS จะขึ้นอุณหภูมิจริงแทน 25(set)</text>
</svg>