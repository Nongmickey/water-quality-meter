<text x="600" y="429.0" font-size="12.5" fill="#102a32" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">0.1µF</text>
<circle cx="540" cy="330" r="5" fill="#102a32"/>
<circle cx="470" cy="290" r="7" fill="#102a32"/>
<rect x="352" y="248" width="76" height="26" rx="13" fill="#fff4cc" stroke="#d4a017"/>
<text x="390" y="266" font-size="14" fill="#102a32" text-anchor="middle" font-weight="bold">จุด T</text>
<polyline points="300,460 673,460" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/>
<circle cx="540" cy="460" r="5" fill="#102a32"/>
<circle cx="600" cy="460" r="5" fill="#102a32"/>
<text x="450" y="482" font-size="12" fill="#2b2b2b" text-anchor="middle">รางกราวด์ → G</text>
<path d="M35 545 L45 680 L125 680 L135 545" fill="#e3f3f8" stroke="#8fb8c6" stroke-width="2.5"/>
<rect x="38" y="585" width="94" height="93" fill="#bfe3ef" opacity="0.7"/>
<rect x="70" y="520" width="30" height="130" rx="10" fill="#c7cdd0" stroke="#7d878b" stroke-width="2"/>
<text x="112" y="500" font-size="14" fill="#102a32" text-anchor="start" font-weight="bold">หัววัด NTC 10k</text>
<text x="112" y="520" font-size="12.5" fill="#587480" text-anchor="start">(หัวสแตนเลส) จุ่มน้ำ</text>
<polyline points="85,520 85,400 110,380" fill="none" stroke="#3a3a3a" stroke-width="7" stroke-linejoin="round"/>
