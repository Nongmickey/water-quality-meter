<rect x="459" y="260.0" width="22" height="6" fill="#c9a227"/>
<text x="490" y="250.0" font-size="14" fill="#6b4f1d" text-anchor="start" font-weight="bold">4.7kΩ</text>
<text x="590" y="192" font-size="12" fill="#d64545" text-anchor="middle">สายแดง → 3V3 (ห้ามใช้ 5V)</text>
<polyline points="470,290 673,290" fill="none" stroke="#1d8a4a" stroke-width="3.5" stroke-linejoin="round"/>
