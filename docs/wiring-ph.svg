<text x="30" y="785" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">1) Po → R1 4.7kΩ → จุด P · จุด P → สายไป S ของ D35 · จุด P → R2 4.7kΩ → G   (แรงดันเหลือครึ่งหนึ่ง)</text>
<text x="30" y="808" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">2) 10µF: ขายาว (+) ต่อจุด P, ขาข้างแถบขาว (−) ต่อ G · 104: ไม่มีขั้ว ต่อจุด P กับ G</text>
<text x="30" y="831" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">3) V+ → VIN (5V) · G → G · ขา To, Do ไม่ต่อ · ตัวต้านทานเหลือง-ม่วง-แดง-ทอง = 4.7kΩ</text>
<text x="30" y="854" font-size="13.5" fill="#102a32" text-anchor="start" font-weight="bold">4) ตั้งศูนย์ก่อนใช้: ถอดหัววัด ช็อตรูกลางของ BNC กับขอบนอก แล้วหมุน "ปรับ 1" (ใกล้ BNC) จน Po ≈ 2.50 V</text>
<text x="30" y="877" font-size="13.5" fill="#587480" text-anchor="start">   (วัดด้วยมิเตอร์ที่ขา Po กับ G · ที่ D35 จะเห็นครึ่งหนึ่ง ≈ 1.25 V) · "ปรับ 2" ไม่ต้องหมุน</text>
<text x="30" y="900" font-size="13.5" fill="#587480" text-anchor="start">อัปโหลดโค้ด ph_test · กดสั้น = วัด · กดค้าง 3 วิ แล้วปล่อย = คาลิเบรต 6.86 · กดค้าง 6 วิ แล้วปล่อย = คาลิเบรต 4.00</text>
